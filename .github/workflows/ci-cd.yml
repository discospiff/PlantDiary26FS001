name: CI/CD

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read
  id-token: write

env:
  DOTNET_VERSION: '10.0.x'
  PROJECT_PATH: 'PlantDiary26FS001/PlantDiary26FS001.csproj'
  TEST_PROJECT_PATH: 'PlantDiary26FS001.Tests/PlantDiary26FS001.Tests.csproj'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restore
        run: dotnet restore PlantDiary26FS001.slnx
      - name: Build
        run: dotnet build PlantDiary26FS001.slnx --configuration Release --no-restore --warnaserror
      - name: Test
        run: dotnet test "${{ env.TEST_PROJECT_PATH }}" --configuration Release --no-build --logger trx --collect "XPlat Code Coverage"
      - name: Publish
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: dotnet publish "${{ env.PROJECT_PATH }}" --configuration Release --no-build --output ./publish
      - name: Upload publish artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: plant-diary
          path: ./publish

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Download publish artifact
        uses: actions/download-artifact@v4
        with:
          name: plant-diary
          path: ./publish
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: ./publish
